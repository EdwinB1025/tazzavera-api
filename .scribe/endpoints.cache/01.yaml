atics\"]"},{"level":2,"nameEn":"Beany","nameEs":"Granos (Frijoles)","descriptionEn":"Aromatic characteristic of legumes and their derivatives, with earthy, dusty, sour, bitter, starchy and green\/peapod, nutty or brown elements.","descriptionEs":"Arom\u00e1tico caracter\u00edstico de legumbres y derivados, con elementos terrosos, polvorientos, \u00e1cidos, amargos, almidonados y verdes\/a vaina, a nuez o marrones.","color":"#85a67c","categories":"[\"aromatics\"]"}]}]},{"level":0,"nameEn":"Earthy","nameEs":"Terrosos","descriptionEn":null,"descriptionEs":null,"color":"#7a5c43","categories":"[\"aromatics\", \"defects\"]","children":[{"level":1,"nameEn":"Musty\/Earthy","nameEs":"Humedad\/Almizcle de Tierra","descriptionEn":"Somewhat sweet, heavy aromatic associated with decaying vegetation and damp black soil.","descriptionEs":"Arom\u00e1tico algo dulce, pesado, asociado a vegetaci\u00f3n en descomposici\u00f3n y tierra negra h\u00fameda.","color":"#8a705a","categories":"[\"aromatics\", \"defects\"]","children":[{"level":2,"nameEn":"Musty\/Dusty","nameEs":"Humedad\/Almizcle del polvo","descriptionEn":"Aromatic associated with dry, closed spaces such as attics and closets. May have dry, musty, papery, dry-earth or grain elements.","descriptionEs":"Arom\u00e1tico asociado a espacios secos y cerrados como \u00e1ticos y armarios. Puede tener elementos secos, mohosos, a papel, tierra seca o grano.","color":"#9a8370","categories":"[\"aromatics\"]"},{"level":2,"nameEn":"Moldy\/Damp","nameEs":"Mohoso","descriptionEn":"Aromatic associated with damp, closed spaces or basements. May be moldy, sharp and slightly green.","descriptionEs":"Arom\u00e1tico asociado a espacios h\u00famedos y cerrados o s\u00f3tanos. Puede ser mohoso, agudo y ligeramente verde.","color":"#9a8370","categories":"[\"defects\"]"}]},{"level":1,"nameEn":"Woody","nameEs":"Amaderado","descriptionEn":"Sweet, brown, musty, dark aromatic associated with tree bark.","descriptionEs":"Arom\u00e1tico dulce, marr\u00f3n,