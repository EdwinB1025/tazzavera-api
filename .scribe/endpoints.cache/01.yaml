imes.","descriptionEs":"Arom\u00e1tico c\u00edtrico, \u00e1cido, astringente, amargo, verde, a c\u00e1scara, agudo y algo floral, asociado a las limas.","color":"#ba7483","categories":"[\"aromatics\"]"}]}]},{"level":0,"nameEn":"Sour\/Acid","nameEs":"\u00c1cidos","descriptionEn":null,"descriptionEs":null,"color":"#c2b34a","categories":"[\"main_tastes\", \"aromatics\"]","children":[{"level":1,"nameEn":"Sour Aromatics","nameEs":"\u00c1cidos Arom\u00e1ticos","descriptionEn":"Aromatic associated with the impression of a sour product.","descriptionEs":"Arom\u00e1tico asociado a la impresi\u00f3n de un producto \u00e1cido.","color":"#c9bc60","categories":"[\"aromatics\"]","children":[{"level":2,"nameEn":"Acetic Acid","nameEs":"\u00c1cido Ac\u00e9tico","descriptionEn":"Sour, astringent, slightly pungent aromatic associated with vinegar.","descriptionEs":"Arom\u00e1tico \u00e1cido, astringente, ligeramente punzante, asociado al vinagre.","color":"#d1c575","categories":"[\"aromatics\"]"},{"level":2,"nameEn":"Butyric Acid","nameEs":"\u00c1cido But\u00edrico","descriptionEn":"Sour, fermented-dairy aromatic associated with certain aged cheeses such as parmesan.","descriptionEs":"Arom\u00e1tico \u00e1cido, a l\u00e1cteo fermentado, asociado a ciertos quesos curados como el parmesano.","color":"#d1c575","categories":"[\"aromatics\"]"},{"level":2,"nameEn":"Isovaleric Acid","nameEs":"\u00c1cido Isoval\u00e9rico","descriptionEn":"Pungent, sour aromatic associated with the smell of sweaty feet and certain aged cheeses such as romano.","descriptionEs":"Arom\u00e1tico punzante, \u00e1cido, asociado al olor a pies sudados y a ciertos quesos curados como el romano.","color":"#d1c575","categories":"[\"aromatics\"]"},{"level":2,"nameEn":"Citric Acid","nameEs":"\u00c1cido C\u00edtrico","descriptionEn":"Mild, clean, sour aromatic with light citrus notes accompanied by astringency.","descriptionEs":"Arom\u00e1tico suave, limpio, \u00e1cido, con ligeras notas c\u00edtricas acompa\u00f1ado de as