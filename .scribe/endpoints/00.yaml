    uri: register
    metadata:
      custom: []
      groupName: Users
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Register a user'
      description: |-
        Creates a new user account and assigns the requested role. Public
        registration endpoint. User creation and role assignment happen in a
        single transaction; if role assignment fails, the whole operation is
        rolled back.

        The new user is also signed in: the response carries a `token` block
        with the same fields as `POST /oauth/token` (`token_type`,
        `expires_in`, `access_token`, `refresh_token`), issued on the front
        client with the default scope (`profile:read`) by an internal grant
        that `POST /oauth/token` does not offer. The refresh token is refreshed
        with the front client's usual `refresh_token` request. If the tokens
        cannot be issued, the user is still created and the response has no
        `token` block.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: 'User first name.'
        required: true
        example: Augusto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      surname:
        custom: []
        name: surname
        description: 'User last name.'
        required: true
        example: Restrepo
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      email:
        custom: []
        name: email
        description: 'Email address. Must be unique. Must be a valid email address.'
        required: true
        example: augusto@example.com
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Password. Must meet the default strength rules and be confirmed via passwordConfirmation. The value and <code>passwordConfirmation</code> must match.'
        required: true
        example: Str0ngP@ss!
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      passwordConfirmation:
        custom: []
        name: passwordConfirmation
        description: 'Confirmation of the new password. Must match the password field. Note: camelCase, not the Laravel-default password_confirmation.'
        required: true
        example: NewStr0ng!
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      role:
        custom: []
        name: role
        description: 'Optional. Role to assign at registration. One of: coffeeshop, specialist, user.'
        required: false
        example: coffeeshop
        type: string
        enumValues:
          - coffeeshop
          - specialist
          - user
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
