                      ulid:
                        type: string
                        example: 01M35F5RX4ADGC3CSDXXYB08DD
                      name:
                        type: string
                        example: Andrés
                      surname:
                        type: string
                        example: Gómez
                      email:
                        type: string
                        example: andres@tazavera.test
                      role:
                        type: string
                        example: specialist
      tags:
        - Users
