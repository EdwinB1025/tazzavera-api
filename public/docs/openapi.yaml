    delete:
      summary: 'Delete an evaluation'
      operationId: deleteAnEvaluation
      description: "Permanently deletes an evaluation. This action cannot be undone.\n\n**Authorization:** requires the `specialist` role and permission to delete\nthe evaluation (enforced by the evaluation policy). A specialist who does\nnot own the evaluation receives `403 Forbidden`."
      parameters: []
      responses:
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Evaluation(s) deleted.'
                properties:
                  message:
                    type: string
                    example: 'Evaluation(s) deleted.'
        403:
          description: 'Not the owner'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'One or more evaluations do not belong to the user.'
                properties:
                  message:
                    type: string
                    example: 'One or more evaluations do not belong to the user.'
      tags:
        - Evaluations
    parameters:
      -
        in: path
        name: evaluation_ulid
        description: 'The ULID of the evaluation.'
        example: 01M35F5RX4ADGC3CSDXXYB08DA
        required: true
        schema:
          type: string
