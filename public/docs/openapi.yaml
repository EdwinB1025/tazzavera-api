    post:
      summary: 'Create offerings'
      operationId: createOfferings
      description: "Creates one offering per location for a given coffee inventory item. A single\nrequest may target multiple locations; one offering is created for each,\nall within a single database transaction (all-or-nothing).\n\n**Authorization:** requires the `coffeeshop` role and the `profile:write`\nscope. The authenticated user must own every location referenced\n(`owns.location`)."
      parameters: []
      responses: {}
      tags:
        - Offerings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coffeeInventoryId:
                  type: string
                  description: 'The ULID of the coffee inventory item the offerings are based on. Despite the name, this expects a ULID, not a numeric ID. Must match an existing stored value.'
                  example: 01J8ZK...
                locations:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - architecto
                  items:
                    type: string
              required:
                - coffeeInventoryId
    delete:
      summary: 'Delete multiple offerings'
      operationId: deleteMultipleOfferings
      description: "Permanently deletes several offerings in one request, identified by their\nULIDs (maximum 50). This action cannot be undone.\n\n**Authorization:** requires the `coffeeshop` role and the `profile:write`\nscope. The authenticated user must own all referenced offerings\n(`owns.offering`)."
      parameters: []
      responses:
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Offering deleted.'
                properties:
                  message:
                    type: string
                    example: 'Offering deleted.'
      tags:
        - Offerings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offerings:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - architecto
                  items:
                    type: string
              required:
                - offerings
