  /evaluations:
    get:
      summary: 'List evaluations'
      operationId: listEvaluations
      description: "Returns a paginated list of sensory evaluations, each including its taste\nnotes (olfactory taxonomy references) and the offering it belongs to.\nSupports filtering and sorting via query parameters."
      parameters:
        -
          in: query
          name: evaluatorId
          description: 'Filter by the evaluating specialist (user) ULID. Must match an existing stored value.'
          example: 01M35F5RX4ADGC3CSDXXYB08DA
          required: false
          schema:
            type: string
            description: 'Filter by the evaluating specialist (user) ULID. Must match an existing stored value.'
            example: 01M35F5RX4ADGC3CSDXXYB08DA
        -
          in: query
          name: coffeeId
          description: 'Filter by coffee ULID. Must match an existing stored value.'
          example: 01M35F5JEZMS845TNPAEM1V8PF
          required: false
          schema:
            type: string
            description: 'Filter by coffee ULID. Must match an existing stored value.'
            example: 01M35F5JEZMS845TNPAEM1V8PF
        -
          in: query
          name: locationId
          description: 'Filter by location ULID. Must match an existing stored value.'
          example: 01M35F5JDFXM13R1CA06FFWTNG
          required: false
          schema:
            type: string
            description: 'Filter by location ULID. Must match an existing stored value.'
            example: 01M35F5JDFXM13R1CA06FFWTNG
        -
          in: query
          name: city
          description: 'Filter by the city of the evaluation location. Must not be greater than 90 characters.'
          example: Barcelona
          required: false
          schema:
            type: string
            description: 'Filter by the city of the evaluation location. Must not be greater than 90 characters.'
            example: Barcelona
        -
          in: query
          name: process
          description: 'Filter by coffee processing method. Must not be greater than 90 characters.'
          example: Washed
          required: false
          schema:
            type: string
            description: 'Filter by coffee processing method. Must not be greater than 90 characters.'
            example: Washed
        -
          in: query
          name: status
          description: 'Filter by evaluation status. One of: open, closed.'
          example: closed
          required: false
          schema:
            type: string
            description: 'Filter by evaluation status. One of: open, closed.'
            example: closed
            enum:
              - open
              - closed
        -
          in: query
          name: scoreMin
          description: 'Minimum cupping score (0–100). Must be at least 0. Must not be greater than 100.'
          example: 80.0
          required: false
          schema:
            type: number
            description: 'Minimum cupping score (0–100). Must be at least 0. Must not be greater than 100.'
            example: 80.0
        -
          in: query
          name: scoreMax
          description: 'Maximum cupping score (0–100). Must be ≥ scoreMin. Must be at least 0. Must not be greater than 100.'
          example: 95.0
          required: false
          schema:
            type: number
            description: 'Maximum cupping score (0–100). Must be ≥ scoreMin. Must be at least 0. Must not be greater than 100.'
            example: 95.0
        -
          in: query
          name: orderBy
          description: 'Sort field. One of: cupping_score, created_at, status.'
          example: cupping_score
          required: false
          schema:
            type: string
            description: 'Sort field. One of: cupping_score, created_at, status.'
            example: cupping_score
            enum:
              - cupping_score
              - created_at
              - status
        -
          in: query
          name: orderDirection
          description: 'Sort direction. One of: asc, desc.'
          example: desc
          required: false
          schema:
            type: string
            description: 'Sort direction. One of: asc, desc.'
            example: desc
            enum:
              - asc
              - desc
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The selected evaluator id is invalid. (and 2 more errors)'
                  errors:
                    evaluatorId:
                      - 'The selected evaluator id is invalid.'
                    coffeeId:
                      - 'The selected coffee id is invalid.'
                    locationId:
                      - 'The selected location id is invalid.'
                properties:
                  message:
                    type: string
                    example: 'The selected evaluator id is invalid. (and 2 more errors)'
                  errors:
                    type: object
                    properties:
                      evaluatorId:
                        type: array
                        example:
                          - 'The selected evaluator id is invalid.'
                        items:
                          type: string
                      coffeeId:
