    put:
      summary: 'Update a user'
      operationId: updateAUser
      description: "Updates a user's profile data. Returns the updated user with a\nconfirmation message.\n\n**Authorization:** requires the `profile:write` scope and permission to\nupdate this user (policy). A non-owner receives `403 Forbidden`."
