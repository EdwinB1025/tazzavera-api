  /logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: "Revokes all of the authenticated user's access tokens and their refresh\ntokens, and ends every web session of the user on the server (the ones\nopened by the OAuth login): their rows are deleted from the sessions\ntable and the remember token is regenerated, so a later authorization\nasks for the login again.\n\n**Authorization:** requires the `profile:read` or `profile:write` scope."
      parameters: []
      responses:
        200:
          description: 'Logged out'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'logout successfully.'
                properties:
                  message:
                    type: string
                    example: 'logout successfully.'
      tags:
        - Users
  /register:
    post:
      summary: 'Register a user'
      operationId: registerAUser
      description: "Creates a new user account and assigns the requested role. Public\nregistration endpoint. User creation and role assignment happen in a\nsingle transaction; if role assignment fails, the whole operation is\nrolled back."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    ulid: 01M35F5RX4ADGC3CSDXXYB08DC
                    name: Laura
                    surname: Gómez
                    email: laura@tazavera.test
                    role: coffeeshop
                  message: 'Profile created.'
                properties:
                  data:
                    type: object
                    properties:
                      ulid:
                        type: string
                        example: 01M35F5RX4ADGC3CSDXXYB08DC
                      name:
                        type: string
                        example: Laura
                      surname:
                        type: string
                        example: Gómez
                      email:
                        type: string
                        example: laura@tazavera.test
                      role:
                        type: string
                        example: coffeeshop
                  message:
                    type: string
                    example: 'Profile created.'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'User first name.'
                  example: Augusto
                surname:
                  type: string
                  description: 'User last name.'
                  example: Restrepo
                email:
                  type: string
                  description: 'Email address. Must be unique. El campo value no es un correo válido.'
                  example: augusto@example.com
                password:
                  type: string
                  description: 'Password. Must meet the default strength rules and be confirmed via passwordConfirmation. The value and <code>passwordConfirmation</code> must match.'
                  example: Str0ngP@ss!
                passwordConfirmation:
                  type: string
                  description: 'Confirmation of the new password. Must match the password field. Note: camelCase, not the Laravel-default password_confirmation.'
                  example: NewStr0ng!
                role:
                  type: string
                  description: 'Optional. Role to assign at registration. One of: coffeeshop, specialist, user.'
                  example: coffeeshop
                  enum:
                    - coffeeshop
                    - specialist
                    - user
              required:
                - name
                - surname
                - email
                - password
                - passwordConfirmation
      security: []
  /user:
    get:
      summary: 'Get the authenticated user'
      operationId: getTheAuthenticatedUser
      description: "Returns the profile of the currently authenticated user.\n\n**Authorization:** requires the `profile:read` or `profile:write` scope."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    ulid: 01M35F5RX4ADGC3CSDXXYB08DD
                    name: Andrés
                    surname: Gómez
                    email: andres@tazavera.test
                    role: specialist
                properties:
