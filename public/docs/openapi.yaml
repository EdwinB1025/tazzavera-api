  /logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: "Revokes all of the authenticated user's access tokens and their refresh\ntokens, ending the session.\n\n**Authorization:** requires the `profile:read` or `profile:write` scope."
      parameters: []
      responses:
        200:
          description: 'Logged out'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'logout successfully.'
                properties:
                  message:
                    type: string
                    example: 'logout successfully.'
      tags:
        - Users
  /register:
    post:
      summary: 'Register a user'
      operationId: registerAUser
      description: "Creates a new user account and assigns the requested role. Public\nregistration endpoint. User creation and role assignment happen in a\nsingle transaction; if role assignment fails, the whole operation is\nrolled back."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 66
                    ulid: 01M36SQNA0WSGQCDKFZ26WSAYM
                    name: 'Ms. Audra Crooks II'
                    surname: Rempel
                    email: okon.justina@example.com
                    email_verified_at: '2026-09-23T09:32:16.000000Z'
                    two_factor_secret: null
                    two_factor_recovery_codes: null
                    two_factor_confirmed_at: null
                    created_at: '2026-09-23T09:32:17.000000Z'
                    updated_at: '2026-09-23T09:32:17.000000Z'
                    deleted_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 66
                      ulid:
                        type: string
                        example: 01M36SQNA0WSGQCDKFZ26WSAYM
                      name:
                        type: string
                        example: 'Ms. Audra Crooks II'
                      surname:
                        type: string
                        example: Rempel
                      email:
                        type: string
                        example: okon.justina@example.com
                      email_verified_at:
                        type: string
                        example: '2026-09-23T09:32:16.000000Z'
                      two_factor_secret:
                        type: string
                        example: null
                        nullable: true
                      two_factor_recovery_codes:
                        type: string
                        example: null
                        nullable: true
                      two_factor_confirmed_at:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-09-23T09:32:17.000000Z'
                      updated_at:
                        type: string
                        example: '2026-09-23T09:32:17.000000Z'
                      deleted_at:
                        type: string
                        example: null
                        nullable: true
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                example:
                  data: {}
                  message: 'Profile created.'
                properties:
                  data:
                    type: object
                    properties: {}
                  message:
                    type: string
                    example: 'Profile created.'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'User first name.'
                  example: Augusto
                surname:
                  type: string
                  description: 'User last name.'
                  example: Restrepo
                email:
                  type: string
                  description: 'Email address. Must be unique. Must be a valid email address.'
                  example: augusto@example.com
                password:
                  type: string
                  description: 'Password. Must meet the default strength rules and be confirmed via password_confirmation.'
                  example: Str0ngP@ss!
                role:
                  type: string
                  description: 'Optional. Role to assign at registration. One of: coffeeshop, specialist, user.'
                  example: coffeeshop
                  enum:
                    - coffeeshop
                    - specialist
                    - user
              required:
                - name
                - surname
                - email
                - password
      security: []
