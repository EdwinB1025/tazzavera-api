openapi: 3.0.3
info:
  title: 'tazavera_api API Documentation'
  description: 'REST API for the Tazavera specialty coffee platform. Provides endpoints for managing coffee offerings, sensory evaluations (cupping), user profiles, and supporting taxonomies. Authentication is handled via Laravel Passport (OAuth 2.0) using the Authorization Code flow with PKCE for first-party clients and the Password grant for trusted clients.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Coffee Inventory'
    description: ''
  -
    name: Evaluations
    description: ''
  -
    name: Locations
    description: ''
  -
    name: Offerings
    description: ''
  -
    name: Taxonomies
    description: ''
  -
    name: Users
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "This API uses **Laravel Passport (OAuth 2.0)**. Authenticated endpoints require a Bearer access token in the `Authorization` header. Two grant flows are supported:\n\n**Authorization Code + PKCE** (recommended, for public/first-party clients such as SPAs and mobile apps that cannot safely store a client secret):\n1. Generate a `code_verifier` (random string) and derive a `code_challenge` = BASE64URL(SHA256(`code_verifier`)).\n2. Redirect the user to `GET /oauth/authorize` with `response_type=code`, your `client_id`, `redirect_uri`, `scope`, `state`, `code_challenge`, and `code_challenge_method=S256`.\n3. After the user approves, exchange the returned `code` at `POST /oauth/token` with `grant_type=authorization_code`, the `code`, `redirect_uri`, `client_id`, and the original `code_verifier`.\n4. The response contains `access_token`, `refresh_token`, and `expires_in`.\n\n**Password grant** (for trusted first-party clients only):\n- `POST /oauth/token` with `grant_type=password`, `client_id`, `client_secret`, the user's `username` and `password`, and the required `scope`.\n- The response contains `access_token`, `refresh_token`, and `expires_in`.\n\nSend the token as: `Authorization: Bearer {ACCESS_TOKEN}`.\n\n**Scopes:** endpoints enforce `profile:read` and/or `profile:write`. Request the appropriate scope when obtaining your token, or the request will be rejected."
security:
  -
    default: []
paths:
  /coffeeInventory:
    get:
      summary: 'List coffee inventory'
      operationId: listCoffeeInventory
      description: "Returns coffee inventory items, each with coffee details (including\ncurrently valid certifications) and roastery. Used by coffeeshops to\nretrieve available coffees when creating an offering. Supports filtering\nvia query parameters.\n\nOnly non-expired certifications are included (those with no expiry, or an\nexpiry date in the future).\n\n**Authorization:** requires the `coffeeshop` role and the `profile:read`\nor `profile:write` scope."
      parameters:
        -
          in: query
          name: coffeeName
          description: 'Filter by coffee name (max 150 chars). Must not be greater than 150 characters.'
          example: Geisha
          required: false
          schema:
            type: string
            description: 'Filter by coffee name (max 150 chars). Must not be greater than 150 characters.'
            example: Geisha
            nullable: true
        -
          in: query
          name: originCountry
          description: 'Filter by country of origin (max 60 chars). Must not be greater than 60 characters.'
          example: Colombia
          required: false
          schema:
            type: string
            description: 'Filter by country of origin (max 60 chars). Must not be greater than 60 characters.'
            example: Colombia
            nullable: true
        -
          in: query
          name: originRegion
          description: 'Filter by region of origin (max 90 chars). Must not be greater than 90 characters.'
          example: Huila
          required: false
          schema:
            type: string
            description: 'Filter by region of origin (max 90 chars). Must not be greater than 90 characters.'
            example: Huila
            nullable: true
        -
          in: query
          name: process
          description: 'Filter by processing method (max 60 chars). Must not be greater than 60 characters.'
          example: Washed
          required: false
          schema:
            type: string
            description: 'Filter by processing method (max 60 chars). Must not be greater than 60 characters.'
            example: Washed
            nullable: true
        -
          in: query
          name: producer
          description: 'Filter by producer name (max 150 chars). Must not be greater than 150 characters.'
          example: 'Finca La Esperanza'
          required: false
          schema:
            type: string
            description: 'Filter by producer name (max 150 chars). Must not be greater than 150 characters.'
            example: 'Finca La Esperanza'
            nullable: true
        -
          in: query
          name: city
          description: 'Filter by city (max 90 chars). Must not be greater than 90 characters.'
          example: Barcelona
          required: false
          schema:
            type: string
            description: 'Filter by city (max 90 chars). Must not be greater than 90 characters.'
            example: Barcelona
            nullable: true
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      ulid: 01M36SQP8PFS04WB0C15FAWKQ2
                      roastLot: 2026-08-26-552013
