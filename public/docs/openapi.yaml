  '/evaluations/{evaluation_ulid}':
    get:
      summary: 'Get an evaluation'
      operationId: getAnEvaluation
      description: 'Returns a single evaluation with its taste notes and associated offering.'
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\Evaluation] architecto'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\Evaluation] architecto'
      tags:
        - Evaluations
      security: []
    put:
      summary: 'Update an evaluation'
      operationId: updateAnEvaluation
      description: "Updates an existing evaluation. Returns the updated evaluation with a\nconfirmation message. The body structure matches the create endpoint,\nexcept `offeringId` is prohibited — an evaluation cannot be reassigned to\nanother offering.\n\nA **closed** evaluation cannot be updated; attempting to do so returns\n`409 Conflict`.\n\n**Authorization:** requires the `specialist` role and permission to update\nthe evaluation (enforced by the evaluation policy). A specialist who does\nnot own the evaluation receives `403 Forbidden`."
      parameters: []
      responses:
        403:
          description: 'Not the owner'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'One or more evaluations do not belong to the user.'
                properties:
                  message:
                    type: string
                    example: 'One or more evaluations do not belong to the user.'
        409:
          description: 'Evaluation already closed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Evaluation cannot be updated.'
                properties:
                  message:
                    type: string
                    example: 'Evaluation cannot be updated.'
      tags:
        - Evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                offeringId:
                  type: string
                  description: 'Prohibited on update — an evaluation cannot be reassigned to another offering. Sending this field returns 422.'
