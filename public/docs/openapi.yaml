                        certifications:
                          -
                            code: organic
                            description: 'Certified organic production.'
                      roastery:
                        ulid: 01K5W7H3M9Q2T6X4B8N1R5V0CE
                        name: 'Nómada Roasters'
                        description: 'Tostador de especialidad en Barcelona.'
                    -
