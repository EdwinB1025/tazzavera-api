  '/evaluations/{evaluation_ulid}/close':
    patch:
      summary: 'Close an evaluation'
      operationId: closeAnEvaluation
      description: "Transitions an evaluation to the **closed** state, finalizing it. A closed\nevaluation can no longer be updated. No request body is required — the\nevaluation is validated and closed using the data already stored.\n\nThe evaluation is only closed if it is complete. Completeness requires all\n15 sensory scores greater than 0 (7 descriptive + 8 affective), plus at\nleast one taste reference for each of: main tastes, mouthfeel, and the\naromatic set (fragrance/aroma/flavor/aftertaste). If any is missing, the\nrequest fails with `409 Conflict`.\n\nIf the evaluation is **already closed**, the endpoint returns `200 OK`\nidempotently.\n\nClosing dispatches an `EvaluationClosed` event, which recalculates the\noffering's aggregate scores and concordance (via OfferingConsensusService).\n\n**Authorization:** requires the `specialist` role and permission to update\nthe evaluation (enforced by the evaluation policy). A specialist who does\nnot own the evaluation receives `403 Forbidden`."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Closed successfully'
                    type: object
                    example:
                      message: 'Evaluation closed.'
                    properties:
                      message:
                        type: string
                        example: 'Evaluation closed.'
                  -
                    description: 'Already closed'
                    type: object
                    example:
                      message: 'Evaluation closed.'
                    properties:
                      message:
                        type: string
                        example: 'Evaluation closed.'
        403:
          description: 'Not the owner'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'One or more evaluations do not belong to the user.'
                properties:
                  message:
                    type: string
                    example: 'One or more evaluations do not belong to the user.'
        409:
          description: 'Evaluation incomplete'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Evaluation is incomplete, all scores need to be provided, and at least one cata attribute for each MainTastes, mouthfeel and the set of sensorial axis.'
                properties:
                  message:
                    type: string
                    example: 'Evaluation is incomplete, all scores need to be provided, and at least one cata attribute for each MainTastes, mouthfeel and the set of sensorial axis.'
      tags:
        - Evaluations
    parameters:
      -
        in: path
        name: evaluation_ulid
        description: 'The ULID of the evaluation.'
        example: 01M35F5RX4ADGC3CSDXXYB08DA
        required: true
        schema:
          type: string
