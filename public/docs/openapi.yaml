    delete:
      summary: 'Delete an offering'
      operationId: deleteAnOffering
      description: "Permanently deletes a single offering. This action cannot be undone.\n\n**Authorization:** requires the `coffeeshop` role and the `profile:write`\nscope. The authenticated user must own the offering (`owns.offering`)."
      parameters: []
      responses:
        200:
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Offering(s) deleted.'
                properties:
                  message:
                    type: string
                    example: 'Offering(s) deleted.'
      tags:
        - Offerings
    parameters:
      -
        in: path
        name: offering_ulid
        description: 'The ULID of the offering.'
        example: 01K6A3M8Q2V7XH4T9B5N1RCW0D
        required: true
        schema:
          type: string
  /offerings:
    get:
      summary: 'List offerings'
      operationId: listOfferings
